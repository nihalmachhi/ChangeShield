[project]
name = "changeshield"
version = "0.1.0"
description = "Read-only reachability and intent analysis for network changes"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx2>=2,<3", "ruff>=0.6,<1"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["changeshield"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]



